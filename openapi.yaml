                    id: { type: string, enum: [rest, openapi, database, package, template] }
                    label: { type: string }
                    blurb: { type: string }
                    urlPlaceholder: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

