        - $ref: "#/components/parameters/Search"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - $ref: "#/components/parameters/OffsetCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
