          schema: { type: string }
        - { name: agent_id, in: query, schema: { type: string } }
        - { name: agent_name, in: query, description: "ILIKE (można użyć `%`).", schema: { type: string } }
        - name: decision
          in: query
          description: Wiele wartości — powtórzony parametr albo lista po przecinku.
          schema: { type: array, items: { $ref: "#/components/schemas/UiDecision" } }
          style: form
          explode: true
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
