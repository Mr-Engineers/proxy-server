openapi: 3.1.0
info:
  title: proxy-server
  version: 0.2.0
  description: |
    Security proxy — jedyny punkt wyjścia agenta. Ruch do LLM (hop A), aplikacji (hop B), MCP i innych agentów
    przechodzi przez proxy.

    Dwie powierzchnie:

    - **Agent API** (`/v1/*`, `/apps/*`) — uwierzytelnienie kluczem agenta `Authorization: Bearer ak_<key_id>_<secret>`.
      Błędy w kształcie `{error: {type, code, message}}`; odpowiedzi decyzji (D10) zawsze niosą `decision_id`
      (także w nagłówku `X-Decision-Id`) i nigdy nie zawierają uzasadnień.
    - **Admin API** (`/api/v1/*`) — control plane dla UI, JWT Supabase. Błędy `{detail}`, błąd walidacji → `400`.

    Każda odpowiedź ma nagłówek `X-Request-Id`.
servers:
  - url: http://localhost:8080
    description: Lokalnie (`uvicorn app.main:app --port 8080`)
tags:
  - name: Health
  - name: Agent
    description: Sesje agenta i long-poll approvali.
  - name: LLM
    description: Hop A — OpenAI-compatible, tylko obserwacja.
  - name: Apps
    description: Hop B — egzekwowanie polityk przed wywołaniem aplikacji.
  - name: Overview
  - name: Agents
  - name: Rules
  - name: Quotas
  - name: Approvals
  - name: Audit
  - name: Sessions
  - name: Roles
  - name: MCP
  - name: Policies
  - name: Settings
  - name: Profile
  - name: Specialists
  - name: Simulator

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: health
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, config_revision]
                properties:
                  status: { type: string, const: ok }
                  config_revision: { type: integer, description: Rewizja snapshotu konfiguracji w pamięci. }

  # ------------------------------------------------------------------ Agent API

  /v1/sessions:
    post:
      tags: [Agent]
      summary: Utwórz sesję
      operationId: createSession
      security: [{ agentKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                task: { type: [string, "null"], maxLength: 4000, description: Opis zadania agenta. }
            example: { task: restock }
      responses:
        "201":
          description: Sesja utworzona
          content:
            application/json:
              schema:
                type: object
                required: [session_id, agent_id, status, created_at]
                properties:
                  session_id: { type: string, example: sess_3f9a1c0b2d4e5f6a7b8c }
                  agent_id: { type: string, example: purchasing-agent }
                  status: { $ref: "#/components/schemas/SessionStatus" }
                  created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/AgentUnauthorized" }
        "403": { $ref: "#/components/responses/AgentForbidden" }

  /v1/sessions/{session_id}/close:
    post:
      tags: [Agent]
      summary: Zamknij sesję
      operationId: closeSession
      security: [{ agentKey: [] }]
      parameters:
        - { name: session_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Sesja zamknięta (lub już nieaktywna — zwracany jest bieżący status)
          content:
            application/json:
              schema:
                type: object
                required: [session_id, status]
                properties:
                  session_id: { type: string }
                  status: { $ref: "#/components/schemas/SessionStatus" }
        "401": { $ref: "#/components/responses/AgentUnauthorized" }
        "403": { $ref: "#/components/responses/AgentForbidden" }
        "404":
          description: "`unknown_session` — sesja nie istnieje albo należy do innego agenta"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentError" }

  /v1/approvals/{approval_id}:
    get:
      tags: [Agent]
      summary: Long-poll decyzji człowieka
      description: |
        Przy `wait > 0` i statusie `pending` żądanie czeka do `wait` sekund na rozstrzygnięcie.
        Po zatwierdzeniu `approved` pojawia się dopiero po wykonaniu zapamiętanego requestu (do tego czasu `202`).
      operationId: pollApproval
      security: [{ agentKey: [] }]
      parameters:
        - { name: approval_id, in: path, required: true, schema: { type: string } }
        - name: wait
          in: query
          description: Maksymalny czas oczekiwania w sekundach.
          schema: { type: integer, minimum: 0, maximum: 30, default: 0 }
      responses:
        "200":
          description: Rozstrzygnięte — `approved`, `rejected` albo `expired`
          headers:
            X-Decision-Id: { $ref: "#/components/headers/X-Decision-Id" }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ApprovalApproved"
                  - $ref: "#/components/schemas/ApprovalRejected"
                  - $ref: "#/components/schemas/ApprovalExpired"
                discriminator: { propertyName: status }
        "202":
          description: Wciąż oczekuje na człowieka (albo zatwierdzone, ale jeszcze niewykonane)
          headers:
            X-Decision-Id: { $ref: "#/components/headers/X-Decision-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalPending" }
        "401": { $ref: "#/components/responses/AgentUnauthorized" }
        "403": { $ref: "#/components/responses/AgentForbidden" }
        "404":
          description: "`unknown_approval`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentError" }
        "422":
          description: "`wait` poza zakresem 0–30"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorList" }

  /v1/chat/completions:
    post:
      tags: [LLM]
      summary: Chat completions (hop A)
      description: |
        OpenAI-compatible, przekazywane do skonfigurowanego upstreamu LLM bez zmian. Proxy tylko obserwuje:
        uwierzytelnia agenta, sprawdza allowlistę modeli (`llmModels`, pusta = dowolny), a z `X-Session-Id`
        zapisuje hopy, `tool_calls` z odpowiedzi i skan wejścia do stanu sesji. Streaming nie jest obsługiwany.
      operationId: chatCompletions
      security: [{ agentKey: [] }]
      parameters:
        - $ref: "#/components/parameters/SessionIdOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Body w formacie OpenAI Chat Completions.
              required: [model, messages]
              additionalProperties: true
              properties:
                model: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      role: { type: string, enum: [system, user, assistant, tool] }
                      content:
                        oneOf:
                          - type: string
                          - type: array
                            items: { type: object, additionalProperties: true }
                stream: { type: boolean, const: false }
                tools: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        "200":
          description: Odpowiedź upstreamu (status i body przekazane 1:1)
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: "`invalid_json`, `stream_not_supported`, `session_required`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentError" }
        "401": { $ref: "#/components/responses/AgentUnauthorized" }
        "403":
          description: "`agent_disabled`, `model_not_allowed`, `invalid_session`, `session_closed`, `session_terminated`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentError" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503":
          description: "`llm_not_configured`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentError" }
        "504": { $ref: "#/components/responses/UpstreamError" }

  /apps/{app_id}/{path}:
    parameters:
      - name: app_id
        in: path
        required: true
        description: Aplikacja REST z `proxy.apps` (np. `warehouse`, `marketplace`).
        schema: { type: string }
        example: warehouse
      - name: path
        in: path
        required: true
        description: |
          Ścieżka upstreamu (może zawierać `/`). Dopasowywana do katalogu akcji (`proxy.tools`);
          nieznana trasa = DENY. Segmenty `.` i `..` są odrzucane.
        schema: { type: string }
        example: low-stock
      - $ref: "#/components/parameters/SessionIdRequired"
    get: &appCall
      tags: [Apps]
      summary: Wywołanie aplikacji przez proxy (hop B)
      description: |
        Pipeline: auth agenta → sesja → katalog akcji (nieznana trasa → DENY) → walidacja `input_schema` → kwoty →
        RBAC → enrichment → Cedar + reguły UI → sygnały ML → agregator.

        - **ALLOW** — request idzie do upstreamu z nagłówkiem `X-On-Behalf-Of`; status i body upstreamu wracają 1:1.
        - **DENY** — `403 blocked` (albo `400 invalid_arguments` przy niezgodności z `input_schema`);
          po przekroczeniu limitu odmów w sesji — `403 session_terminated`.
        - **ESCALATE** — `202 pending_approval`; wynik przez `GET /v1/approvals/{id}?wait=30`.
        - **RATE_LIMITED** — `429` z `Retry-After`.

        Query, parametry ścieżki i body są przekazywane bez zmian.
      security: [{ agentKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: ALLOW — odpowiedź upstreamu (dowolny status upstreamu przekazywany 1:1)
          headers:
            X-Decision-Id: { $ref: "#/components/headers/X-Decision-Id" }
          content:
            application/json:
              schema: {}
        "202":
          description: Eskalacja do człowieka
          headers:
            X-Decision-Id: { $ref: "#/components/headers/X-Decision-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionPendingApproval" }
        "400":
          description: "`invalid_arguments` (decyzja), albo `invalid_path` / `session_required` (`AgentError`)"
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DecisionResponse"
                  - $ref: "#/components/schemas/AgentError"
        "401": { $ref: "#/components/responses/AgentUnauthorized" }
        "403":
          description: |
            `blocked` / `session_terminated` (decyzja), albo `agent_disabled`, `invalid_session`,
            `session_closed`, `session_terminated` przy wejściu (`AgentError`)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DecisionResponse"
                  - $ref: "#/components/schemas/AgentError"
        "404":
          description: "`unknown_app`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentError" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "429":
          description: Przekroczona kwota
          headers:
            X-Decision-Id: { $ref: "#/components/headers/X-Decision-Id" }
            Retry-After: { $ref: "#/components/headers/Retry-After" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecisionRateLimited" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "504": { $ref: "#/components/responses/UpstreamError" }
    post: *appCall
    put: *appCall
    patch: *appCall
    delete: *appCall

  # ------------------------------------------------------------------ Admin API

  /api/v1/overview:
    get:
      tags: [Overview]
      summary: Metryki globalne
      operationId: getOverview
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/TopLimit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/agents:
    get:
      tags: [Agents]
      summary: Lista agentów
      operationId: listAgents
      parameters:
        - $ref: "#/components/parameters/Search"
        - name: status
          in: query
          description: Wiele wartości — powtórzony parametr albo lista po przecinku.
          schema: { type: array, items: { $ref: "#/components/schemas/AgentStatus" } }
          style: form
          explode: true
        - { name: role_id, in: query, schema: { type: string } }
        - name: sort
          in: query
          schema: { type: string, enum: [name, role, status, api_key, last_seen], default: last_seen }
        - $ref: "#/components/parameters/SortDir"
        - $ref: "#/components/parameters/Limit50"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Agents]
      summary: Utwórz agenta (z pierwszym kluczem)
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentCreate" }
      responses:
        "201":
          description: Utworzony; `apiKey` pokazywany tylko raz
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWithKey" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/agents/{agent_id}:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    get:
      tags: [Agents]
      summary: Szczegóły agenta
      operationId: getAgent
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Agents]
      summary: Edytuj agenta
      operationId: patchAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentPatch" }
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/agents/{agent_id}/revoke:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    post:
      tags: [Agents]
      summary: Unieważnij wszystkie klucze agenta
      description: Ustawia status `revoked`. Przywrócenie — przez wygenerowanie nowego klucza.
      operationId: revokeAgent
      responses:
        "200": { $ref: "#/components/responses/Agent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/keys:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    post:
      tags: [Agents]
      summary: Nowy klucz agenta
      description: |
        Klucz pokazywany tylko raz. Stare klucze zostają aktywne do `revoke` (rotacja bez przestoju).
        Agent w statusie `revoked` wraca do `active`.
      operationId: createAgentKey
      responses:
        "201":
          description: Klucz utworzony
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentWithKey" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/overview:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    get:
      tags: [Agents]
      summary: Metryki agenta
      operationId: getAgentOverview
      parameters:
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Tz"
        - $ref: "#/components/parameters/Bucket"
        - $ref: "#/components/parameters/TopLimit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentOverview" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/posture:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    get:
      tags: [Agents]
      summary: Efektywne uprawnienia agenta
      operationId: getAgentPosture
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgentPosture" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/mcp/{server_id}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Agents]
      summary: Podłącz serwer MCP do agenta (poza MVP)
      operationId: attachAgentMcp
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      tags: [Agents]
      summary: Odłącz serwer MCP od agenta (poza MVP)
      operationId: detachAgentMcp
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/agents/{agent_id}/mcp/{server_id}/auth:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - $ref: "#/components/parameters/ServerId"
    post:
      tags: [Agents]
      summary: Autoryzacja MCP dla agenta (poza MVP)
      operationId: authAgentMcp
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/agents/{agent_id}/rules:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    get:
      tags: [Rules]
      summary: Reguły agenta (w kolejności ewaluacji)
      operationId: listRules
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Rule" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Rules]
      summary: Dodaj regułę
      description: Bez `position` reguła trafia na koniec listy.
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleBody" }
      responses:
        "201": { $ref: "#/components/responses/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/rules/{rule_id}:
    parameters:
      - $ref: "#/components/parameters/AgentId"
      - { name: rule_id, in: path, required: true, schema: { type: string } }
    put:
      tags: [Rules]
      summary: Zastąp regułę
      description: Bez `position` pozycja zostaje bez zmian.
      operationId: updateRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleBody" }
      responses:
        "200": { $ref: "#/components/responses/Rule" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Rules]
      summary: Usuń regułę
      operationId: deleteRule
      responses:
        "204": { description: Usunięta }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/rules/meta:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    get:
      tags: [Rules]
      summary: Metadane edytora reguł
      description: Toole per aplikacja, pola dostępne w warunkach (z `input_schema`, `args` i faktów) oraz próbki do dry-run.
      operationId: getRulesMeta
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RulesMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/rules/dry-run:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    post:
      tags: [Rules]
      summary: Dry-run reguł + Cedar
      description: |
        Bez `rules` używa zapisanych reguł agenta; z `rules` — szkicu (np. niezapisanych zmian z edytora).
        Gdy `tool` istnieje w katalogu, odpowiedź zawiera też wynik pakietu Cedar (`policy`).
      operationId: dryRunRules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DryRunBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DryRunResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/agents/{agent_id}/quotas:
    parameters: [{ $ref: "#/components/parameters/AgentId" }]
    get:
      tags: [Quotas]
      summary: Kwoty agenta
      operationId: listQuotas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Quota" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
