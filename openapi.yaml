      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/mcp/remote/discover:
    post:
      tags: [MCP]
      summary: Discover zdalnego serwera (poza MVP)
      operationId: discoverRemoteServer
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/mcp/{server_id}:
    parameters: [{ $ref: "#/components/parameters/ServerId" }]
    get:
      tags: [MCP]
      summary: Szczegóły serwera
      operationId: getServer
      responses:
        "200": { $ref: "#/components/responses/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [MCP]
      summary: Włącz / wyłącz aplikację, zmień nazwę
      operationId: patchServer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: [boolean, "null"] }
                name: { type: [string, "null"] }
      responses:
        "200": { $ref: "#/components/responses/Server" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [MCP]
      summary: Usuń serwer (poza MVP — wyłącz zamiast tego)
      operationId: deleteServer
