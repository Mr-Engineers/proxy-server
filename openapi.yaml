          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - $ref: "#/components/parameters/OffsetCursor"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Operator" } }
                  nextCursor: { $ref: "#/components/schemas/NextCursor" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/settings/operators/invite:
    post:
      tags: [Settings]
      summary: Zaproś operatora (owner / admin)
      operationId: inviteOperator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email, maxLength: 320 }
                role: { type: string, enum: [admin, operator, viewer] }
                name: { type: string, default: "", description: Pusta → część lokalna adresu e-mail. }
      responses:
        "201": { $ref: "#/components/responses/Operator" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/settings/operators/{operator_id}/resend:
    parameters: [{ $ref: "#/components/parameters/OperatorId" }]
    post:
      tags: [Settings]
      summary: Ponów zaproszenie (status `invited`)
      operationId: resendOperatorInvite
      responses:
        "200": { $ref: "#/components/responses/Operator" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/settings/operators/{operator_id}/disable:
    parameters: [{ $ref: "#/components/parameters/OperatorId" }]
    post:
      tags: [Settings]
      summary: Wyłącz operatora (nie dotyczy `owner`)
      operationId: disableOperator
      responses:
        "200": { $ref: "#/components/responses/Operator" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/settings/operators/{operator_id}/enable:
    parameters: [{ $ref: "#/components/parameters/OperatorId" }]
    post:
      tags: [Settings]
      summary: Włącz operatora
      operationId: enableOperator
      responses:
        "200": { $ref: "#/components/responses/Operator" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/me:
    get:
      tags: [Profile]
      summary: Profil zalogowanego operatora
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/specialists:
    get:
      tags: [Specialists]
      summary: Modele ML (specjaliści)
      description: Pusta lista do czasu wpięcia modeli (`MlScorer.describe`).
      operationId: listSpecialists
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Specialist" } }
                  nextCursor: { type: "null" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/specialists/{specialist_id}:
    parameters:
      - { name: specialist_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Specialists]
      summary: Szczegóły specjalisty
      operationId: getSpecialist
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Specialist" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/simulator/{path}:
    parameters:
      - { name: path, in: path, required: true, schema: { type: string } }
    get: &simulator
      tags: [Simulator]
      summary: Simulator (poza MVP)
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
    post: *simulator
    put: *simulator
    patch: *simulator
    delete: *simulator

security:
  - operatorJwt: []

components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      bearerFormat: ak_<key_id>_<secret>
      description: Klucz agenta (`python -m app.cli create-key <agent_id>` lub `POST /api/v1/agents/{id}/keys`).
    operatorJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT z Supabase Auth (HS256 z `SUPABASE_JWT_SECRET` albo RS256/ES256/EdDSA przez JWKS).
        Lokalnie przy `ADMIN_AUTH_DISABLED=true` nagłówek jest zbędny; operatora można wskazać przez `X-Dev-Operator: <email>`.

  headers:
    X-Decision-Id:
      description: Identyfikator decyzji w audycie.
      schema: { type: string, example: dec_8b1e4f0a9c2d3e4f5a6b }
    Retry-After:
      description: Sekundy do ponowienia.
      schema: { type: integer }

  parameters:
    SessionIdRequired:
      name: X-Session-Id
      in: header
      required: true
      description: Sesja z `POST /v1/sessions`, przypięta do agenta.
      schema: { type: string }
    SessionIdOptional:
      name: X-Session-Id
      in: header
      required: false
      description: Gdy podane — hopy i sygnały trafiają do stanu sesji.
      schema: { type: string }
    AgentId:
      { name: agent_id, in: path, required: true, schema: { type: string, example: purchasing-agent } }
    ApprovalId:
      { name: approval_id, in: path, required: true, schema: { type: string } }
    RoleId:
      { name: role_id, in: path, required: true, schema: { type: string } }
    ServerId:
      name: server_id
      in: path
      required: true
      description: Id aplikacji z `proxy.apps`.
      schema: { type: string }
    OperatorId:
      { name: operator_id, in: path, required: true, schema: { type: string } }
    Search:
      { name: search, in: query, schema: { type: string } }
    SortDir:
      name: sort_dir
      in: query
      schema: { type: string, enum: [asc, desc], default: desc }
    Limit50:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: Nieprzezroczysty kursor z `nextCursor` (keyset).
      schema: { type: string }
    OffsetCursor:
      name: cursor
      in: query
      description: Kursor z `nextCursor` (offset jako string).
      schema: { type: string }
    Range:
      name: range
      in: query
      description: Preset okna. Domyślnie `today`; pomiń i podaj `from` + `to` dla zakresu własnego (max 90 dni).
      schema: { type: string, enum: [today, 24h, 7d, 30d] }
    From:
      name: from
      in: query
      description: ISO 8601 ze strefą czasową.
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: ISO 8601 ze strefą czasową, wyłącznie.
      schema: { type: string, format: date-time }
    Tz:
      name: tz
      in: query
      description: Strefa IANA; domyślnie ze snapshotu ustawień.
      schema: { type: string, example: Europe/Warsaw }
    Bucket:
      name: bucket
      in: query
      description: Domyślnie dobierany do okna.
      schema: { type: string, enum: [5m, 15m, 1h, 1d] }
    TopLimit:
      name: top_limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 5 }

  responses:
    # --- agent
    AgentUnauthorized:
      description: "`missing_agent_key`, `invalid_agent_key`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentError" }
    AgentForbidden:
      description: "`agent_disabled`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentError" }
    RequestTooLarge:
      description: "`request_too_large` — body powyżej `MAX_REQUEST_BYTES`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentError" }
    UpstreamError:
      description: "`upstream_unavailable`, `upstream_response_too_large` (502), `upstream_timeout` (504)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AgentError" }
    # --- admin
    BadRequest:
      description: Błędne dane wejściowe
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
    Unauthorized:
      description: Brak / niepoprawny JWT
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
    Forbidden:
      description: Operator wyłączony lub bez uprawnień
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
    NotFound:
      description: Nie znaleziono
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
    Conflict:
      description: Konflikt stanu
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
    NotImplemented:
      description: Poza MVP
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminError" }
    Agent:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Agent" }
    Rule:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Rule" }
    Quota:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Quota" }
    ApprovalResolution:
      description: Rozstrzygnięte
      content:
        application/json:
          schema:
            type: object
            required: [id, decision, mode]
            properties:
              id: { type: string }
              decision: { type: string, enum: [allow, deny] }
              mode: { type: string, enum: [once, deny, temporary] }
    Role:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Role" }
    Server:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Server" }
    PolicyPack:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PolicyPack" }
    Workspace:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Workspace" }
    Operator:
      description: OK
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Operator" }

  schemas:
    # ------------------------------------------------------------ errors
    AgentError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              enum: [authentication_error, permission_error, session_error, not_found, invalid_request_error, upstream_error, policy_error]
            code: { type: string, example: invalid_agent_key }
            message: { type: string }
    AdminError:
      type: object
      required: [detail]
      properties:
        detail: { type: string, example: Unknown agent }
    ValidationErrorList:
      type: object
      required: [detail]
      properties:
        detail: { type: array, items: { type: object, additionalProperties: true } }
    NextCursor:
      type: [string, "null"]
      description: "`null` = ostatnia strona."

    # ------------------------------------------------------------ agent decisions (D10)
    DecisionStatus:
      type: string
      enum: [blocked, invalid_arguments, pending_approval, rate_limited, session_terminated]
    DecisionResponse:
      type: object
      description: Odpowiedź decyzji dla agenta — bez uzasadnień.
      required: [status, decision_id, message, error]
      properties:
        status: { $ref: "#/components/schemas/DecisionStatus" }
        decision_id: { type: string }
        message: { type: string, example: Action blocked by policy }
        error:
          type: object
          required: [type, code, message]
          properties:
            type: { type: string, const: policy_error }
            code: { $ref: "#/components/schemas/DecisionStatus" }
            message: { type: string }
    DecisionPendingApproval:
      allOf:
        - $ref: "#/components/schemas/DecisionResponse"
        - type: object
          required: [approval_id, poll_url, expires_at]
          properties:
            status: { const: pending_approval }
            approval_id: { type: string }
            poll_url: { type: string, example: "/v1/approvals/apr_1234?wait=30" }
            expires_at: { type: string, format: date-time }
    DecisionRateLimited:
      allOf:
        - $ref: "#/components/schemas/DecisionResponse"
        - type: object
          required: [retry_after_seconds]
          properties:
            status: { const: rate_limited }
            retry_after_seconds: { type: integer, minimum: 1 }

    ApprovalPending:
      type: object
      required: [status, decision_id, approval_id, poll_url]
      properties:
        status: { type: string, const: pending_approval }
        decision_id: { type: string }
        approval_id: { type: string }
        poll_url: { type: string }
        expires_at: { type: string, format: date-time, description: Brak, gdy zatwierdzone i trwa wykonanie. }
    ApprovalApproved:
      type: object
      required: [status, decision_id, approval_id, result]
      properties:
        status: { type: string, const: approved }
        decision_id: { type: string }
        approval_id: { type: string }
        result: { $ref: "#/components/schemas/ExecutionResult" }
    ApprovalRejected:
      type: object
      required: [status, decision_id, approval_id, feedback]
      properties:
        status: { type: string, const: rejected }
        decision_id: { type: string }
        approval_id: { type: string }
        feedback: { type: string, description: Uzasadnienie operatora (może być puste). }
    ApprovalExpired:
      type: object
      required: [status, decision_id, approval_id]
      properties:
        status: { type: string, const: expired }
        decision_id: { type: string }
        approval_id: { type: string }
    ExecutionResult:
      type: object
      description: Wynik jednokrotnego wykonania zatwierdzonego requestu.
      required: [status_code]
      properties:
        status_code: { type: integer }
        body: { description: Body upstreamu (JSON lub tekst). }
        error:
          type: string
          enum: [request_tampered, action_no_longer_configured, upstream_timeout, upstream_unavailable, upstream_response_too_large]
        message: { type: string }

    # ------------------------------------------------------------ enums
    AgentStatus: { type: string, enum: [active, disabled, revoked] }
    SessionStatus: { type: string, enum: [active, closed, terminated, expired] }
    ApprovalStatus: { type: string, enum: [pending, approved, rejected, expired] }
    RoleStatus: { type: string, enum: [draft, active, archived] }
    ToolKind: { type: string, enum: [read, write] }
    ServerHealth: { type: string, enum: [healthy, degraded, down, pending] }
    UiDecision:
      type: string
      description: "`caution` = proxy `escalate`."
      enum: [allow, caution, deny, rate_limited]
    ActionStatus:
      type: string
      enum: [forwarded, executed, upstream_error, blocked, rate_limited, pending_approval, approved, rejected, expired, session_terminated, invalid]

    ChainStep:
      type: object
      required: [stage, outcome, detail]
      properties:
        stage: { type: string, enum: [rbac, rules, specialist, human] }
        outcome: { type: string }
        detail: { type: string }
    Reason:
      type: object
      required: [code, severity]
      properties:
        code: { type: string }
        severity: { type: string, enum: [deny, escalate] }
        message: { type: string }
        source: { type: string, default: policy }

    # ------------------------------------------------------------ overview
    Window:
      type: object
      required: [preset, start, end, previousStart, previousEnd, timezone, bucket, compareLabel]
      properties:
        preset: { type: string, enum: [today, 24h, 7d, 30d, custom] }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        previousStart: { type: string, format: date-time }
        previousEnd: { type: string, format: date-time }
        timezone: { type: string }
        bucket: { type: string, enum: [5m, 15m, 1h, 1d] }
        compareLabel: { type: string, example: vs yesterday }
    WindowMetrics:
      type: object
      required: [window, calls, callsDeltaPct, denyRatePct, cautionRatePct, rateLimited, decisionSplit, callsOverTime, topTools, pendingApprovals]
      properties:
        window: { $ref: "#/components/schemas/Window" }
        calls: { type: integer }
        callsDeltaPct: { type: [integer, "null"], description: "`null` gdy w poprzednim okresie nie było wywołań." }
        denyRatePct: { type: integer }
        cautionRatePct: { type: integer }
        rateLimited: { type: integer }
        decisionSplit:
          type: array
          items:
            type: object
            required: [decision, count]
            properties:
              decision: { $ref: "#/components/schemas/UiDecision" }
              count: { type: integer }
        callsOverTime:
          type: array
          items:
            type: object
            required: [start, end, count]
            properties:
              start: { type: string, format: date-time }
              end: { type: string, format: date-time }
              count: { type: integer }
        topTools:
          type: array
          items:
            type: object
            required: [tool, count]
            properties:
              tool: { type: string }
              count: { type: integer }
        pendingApprovals: { type: integer }
    QuotaUsage:
      type: object
      required: [id, agentId, label, used, cap, unit]
      properties:
        id: { type: string }
        agentId: { type: string }
        label: { type: string, example: Purchasing Agent · Daily calls }
        used: { type: integer }
        cap: { type: integer }
        unit: { type: string, const: calls }
    Overview:
      allOf:
        - $ref: "#/components/schemas/WindowMetrics"
        - type: object
          required: [activeAgents, agentSplit, topAgents, budgets]
          properties:
            activeAgents: { type: integer }
            agentSplit:
              type: array
              items:
                type: object
                required: [agentId, agentName, clear, flagged]
                properties:
                  agentId: { type: string }
                  agentName: { type: string }
                  clear: { type: integer }
                  flagged: { type: integer }
            topAgents:
              type: array
              items:
                type: object
                required: [agentId, agentName, count]
                properties:
                  agentId: { type: string }
                  agentName: { type: string }
                  count: { type: integer }
            budgets: { type: array, items: { $ref: "#/components/schemas/QuotaUsage" } }
    AgentOverview:
      allOf:
        - $ref: "#/components/schemas/WindowMetrics"
        - type: object
          required: [clear, flagged, clearToday, cautionToday, budget]
          properties:
            clear: { type: integer }
            flagged: { type: integer, description: caution + deny }
            clearToday: { type: integer, description: Alias `clear` (kompatybilność UI). }
            cautionToday: { type: integer, description: Alias `flagged` (kompatybilność UI). }
            budget:
              oneOf:
                - $ref: "#/components/schemas/QuotaUsage"
                - type: "null"
              description: Kwota dzienna, a gdy jej brak — pierwsza aktywna.

    # ------------------------------------------------------------ agents
    Agent:
      type: object
      required: [id, name, roleId, roleName, status, apiKeyHint, mcpServerIds, createdAt, lastSeenAt, mandate, llmModels, rateLimitOverride, limits]
      properties:
        id: { type: string, example: purchasing-agent }
        name: { type: string }
        roleId: { type: [string, "null"] }
        roleName: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/AgentStatus" }
        apiKeyHint: { type: string, example: "ak_1a2b3c4d_••••x9Yz" }
        mcpServerIds: { type: array, items: { type: string }, description: Aplikacje, do których agent ma jakikolwiek grant. }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
        mandate: { type: string }
        llmModels: { type: array, items: { type: string }, description: Pusta = dowolny model. }
        rateLimitOverride: { type: [integer, "null"], description: "`limits.requests_per_minute`" }
        limits:
          type: object
          additionalProperties: { type: integer }
          example: { requests_per_minute: 60, max_denies_per_session: 3 }
    AgentWithKey:
      allOf:
        - $ref: "#/components/schemas/Agent"
        - type: object
          required: [apiKey]
          properties:
            apiKey: { type: string, description: Pełny klucz — pokazywany tylko raz., example: ak_1a2b3c4d_secret }
    AgentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Agent" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
    AgentCreate:
      type: object
      required: [id, name, mandate]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 200 }
        mandate: { type: string, minLength: 1, maxLength: 4000 }
        roleId: { type: [string, "null"] }
        llmModels: { type: array, items: { type: string }, default: [] }
        limits: { type: object, additionalProperties: { type: integer }, default: {} }
    AgentPatch:
      type: object
      additionalProperties: false
      description: Pola pominięte zostają bez zmian. `rateLimitOverride` = `null` usuwa override; `roleId` = `null` odpina rolę.
      properties:
        roleId: { type: [string, "null"] }
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        status: { type: [string, "null"], enum: [active, disabled, null] }
        mandate: { type: [string, "null"], minLength: 1, maxLength: 4000 }
        llmModels: { type: [array, "null"], items: { type: string } }
        rateLimitOverride: { type: [integer, "null"], minimum: 1 }
    EffectiveTool:
      type: object
      required: [serverId, serverName, tool, via]
      properties:
        serverId: { type: string }
        serverName: { type: string }
        tool: { type: string, example: marketplace.place_order }
        via: { type: string, enum: [server, tool] }
    AgentPosture:
      type: object
      required: [role, callable, unreachable, attachedWithoutGrants]
      properties:
        role:
          oneOf:
            - $ref: "#/components/schemas/Role"
            - type: "null"
        callable: { type: array, items: { $ref: "#/components/schemas/EffectiveTool" } }
        unreachable: { type: array, items: {}, maxItems: 0 }
        attachedWithoutGrants: { type: array, items: { type: string } }

    # ------------------------------------------------------------ rules
    ConditionNode:
      description: Drzewo warunków (max głębokość 8). Węzeł grupy albo liść.
      oneOf:
        - type: object
          required: [combinator]
          properties:
            combinator: { type: string, enum: [and, or] }
            children: { type: array, items: { $ref: "#/components/schemas/ConditionNode" } }
        - type: object
          required: [field, op]
          properties:
            field: { type: string, description: "Szukane w args → request → fakty; kropka = zagnieżdżenie." }
            op: { type: string, enum: [eq, neq, gt, gte, lt, lte, in, not_in, is_empty, not_empty] }
            value: { description: "Lista dla `in` / `not_in`." }
    RuleOutcome: { type: string, enum: [allow, deny, needs_ai] }
    RuleBody:
      type: object
      required: [name, tool, then]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        tool: { type: string, minLength: 1, maxLength: 200, description: "Kwalifikowana nazwa toola; dopuszczalne wzorce glob." }
        when:
          $ref: "#/components/schemas/ConditionNode"
          default: { combinator: and, children: [] }
        then: { $ref: "#/components/schemas/RuleOutcome" }
        enabled: { type: boolean, default: true }
        position: { type: [integer, "null"] }
    Rule:
      type: object
      required: [id, name, agentId, tool, when, then, enabled, position, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        agentId: { type: string }
        tool: { type: string }
        when: { $ref: "#/components/schemas/ConditionNode" }
        then: { $ref: "#/components/schemas/RuleOutcome" }
        enabled: { type: boolean }
        position: { type: integer }
        updatedAt: { type: string, format: date-time }
    RulesMeta:
      type: object
      required: [tools, fields, dryRunSamples]
      properties:
        tools:
          type: array
          items:
            type: object
            required: [serverId, serverName, tools]
            properties:
              serverId: { type: string }
              serverName: { type: string }
              tools: { type: array, items: { type: string } }
        fields:
          type: array
          items:
            type: object
            required: [id, label, type, tools]
            properties:
              id: { type: string }
              label: { type: string }
              type: { type: string, enum: [number, enum, text] }
              values: { type: array, items: {} }
              tools: { type: array, items: { type: string }, description: "`[\"*\"]` dla faktów liczonych." }
              computed: { type: boolean }
        dryRunSamples:
          type: array
          items:
            type: object
            required: [id, label, tool, args]
            properties:
              id: { type: string }
              label: { type: string }
              tool: { type: string }
              args: { type: object, additionalProperties: true }
    DryRunBody:
      type: object
      required: [tool]
      properties:
        tool: { type: string }
        args: { type: object, additionalProperties: true, default: {} }
        rules:
          type: [array, "null"]
          items:
            allOf:
              - $ref: "#/components/schemas/RuleBody"
              - type: object
                properties:
                  id: { type: string }
        sessionState: { type: object, additionalProperties: true, default: {} }
        enrichment: { type: object, additionalProperties: true, default: {} }
    DryRunResult:
      type: object
      required: [matchedRuleId, outcome, detail]
      properties:
        matchedRuleId: { type: [string, "null"] }
        outcome: { oneOf: [{ $ref: "#/components/schemas/RuleOutcome" }, { type: "null" }] }
        detail: { type: string }
        policy:
          type: object
          required: [verdict, reasons, facts]
          properties:
            verdict: { type: string, enum: [allow, deny, escalate] }
            reasons: { type: array, items: { $ref: "#/components/schemas/Reason" } }
            facts: { type: object, additionalProperties: true }

    # ------------------------------------------------------------ quotas
    Quota:
      type: object
      required: [id, name, agentId, agentName, window, cap, used, unit, enabled, burst, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        window: { type: string, enum: [1m, 1h, 1d] }
        cap: { type: integer }
        used: { type: integer }
        unit: { type: string, const: calls }
        enabled: { type: boolean }
        burst: { type: integer }
        updatedAt: { type: string, format: date-time }
    QuotaCreate:
      type: object
      required: [name, window, cap]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        window: { type: string, enum: [1m, 1h, 1d] }
        cap: { type: integer, minimum: 1 }
        burst: { type: integer, minimum: 0, default: 0 }
    QuotaPatch:
      type: object
      properties:
        enabled: { type: [boolean, "null"] }
        name: { type: [string, "null"], minLength: 1, maxLength: 200 }
        cap: { type: [integer, "null"], minimum: 1 }
        burst: { type: [integer, "null"], minimum: 0 }

    # ------------------------------------------------------------ approvals
    Approval:
      type: object
      required: [id, tool, agentId, agentName, specialist, allowProb, denyProb, ageSeconds, ttlSeconds, matchedRules, modelChoice, argsRedacted, createdAt, expiresAt, status, decisionId, sessionId, decisionChain]
      properties:
        id: { type: string }
        tool: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        specialist: { type: string, example: rules/v0 }
        allowProb: { type: [number, "null"], description: "Specialist P(clear); null when model was not scored" }
        denyProb: { type: [number, "null"], description: "Specialist P(deny); null when model was not scored" }
        ageSeconds: { type: integer }
        ttlSeconds: { type: integer }
        matchedRules: { type: array, items: { type: string } }
        modelChoice: { type: string, example: caution → human }
        argsRedacted: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/ApprovalStatus" }
        decisionId: { type: string }
        sessionId: { type: string }
        decisionChain: { type: array, items: { $ref: "#/components/schemas/ChainStep" } }

    # ------------------------------------------------------------ audit
    AuditEvent:
      type: object
      required: [id, timestamp, tool, agentId, agentName, decision, decisionChain, argsRedacted, sessionId, approvalId, actionStatus, httpStatus, degraded]
      properties:
        id: { type: string }
        timestamp: { type: string, format: date-time }
        tool: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        decision: { $ref: "#/components/schemas/UiDecision" }
        decisionChain: { type: array, items: { $ref: "#/components/schemas/ChainStep" } }
        argsRedacted: { type: object, additionalProperties: true }
        sessionId: { type: [string, "null"] }
        approvalId: { type: [string, "null"] }
        actionStatus: { oneOf: [{ $ref: "#/components/schemas/ActionStatus" }, { type: "null" }] }
        httpStatus: { type: [integer, "null"] }
        degraded: { type: boolean }
        quotaId: { type: string, description: Tylko dla `rate_limited`. }
        retryAfterSeconds: { type: [integer, "null"], description: Tylko dla `rate_limited`. }
    AuditEventDetail:
      allOf:
        - $ref: "#/components/schemas/AuditEvent"
        - type: object
          required: [reasons, signals, facts, enrichment, confidence, configRevision, latencyMs, kind, app, requestId, upstreamStatus, approvalStatus]
          properties:
            reasons: { type: array, items: { $ref: "#/components/schemas/Reason" } }
            signals: { type: object, additionalProperties: true }
            facts: { type: object, additionalProperties: true }
            enrichment: { type: object, additionalProperties: true }
            confidence: { type: number }
            configRevision: { type: integer }
            latencyMs: { type: number }
            kind: { $ref: "#/components/schemas/ToolKind" }
            app: { type: string }
            requestId: { type: [string, "null"] }
            upstreamStatus: { type: [integer, "null"] }
            approvalStatus: { oneOf: [{ $ref: "#/components/schemas/ApprovalStatus" }, { type: "null" }] }

    # ------------------------------------------------------------ sessions
    Session:
      type: object
      required: [id, agentId, agentName, task, status, denyCount, terminationReason, createdAt, lastActivityAt, closedAt, decisions, pendingApprovals]
      properties:
        id: { type: string }
        agentId: { type: string }
        agentName: { type: string }
        task: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/SessionStatus" }
        denyCount: { type: integer }
        terminationReason: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        lastActivityAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        decisions: { type: integer }
        pendingApprovals: { type: integer }
    TimelineEntry:
      type: object
      required: [hopId, seq, timestamp, direction, protocol, app, tool, method, path, upstreamStatus, upstreamLatencyMs, payload]
      properties:
        hopId: { type: string }
        seq: { type: integer }
        timestamp: { type: string, format: date-time }
        direction: { type: string, enum: [request, response] }
        protocol: { type: string, enum: [rest, llm, mcp] }
        app: { type: string }
        tool: { type: [string, "null"] }
        method: { type: [string, "null"] }
        path: { type: [string, "null"] }
        upstreamStatus: { type: [integer, "null"] }
        upstreamLatencyMs: { type: [number, "null"] }
        payload: { type: object, additionalProperties: true }
        decision:
          type: object
          description: Tylko dla hopów request, dla których zapadła decyzja.
          required: [id, decision, confidence, reasons, decisionChain, actionStatus, degraded, approvalId, approvalStatus, feedback, resolvedBy]
          properties:
            id: { type: string }
            decision: { $ref: "#/components/schemas/UiDecision" }
            confidence: { type: number }
            reasons: { type: array, items: { $ref: "#/components/schemas/Reason" } }
            decisionChain: { type: array, items: { $ref: "#/components/schemas/ChainStep" } }
            actionStatus: { oneOf: [{ $ref: "#/components/schemas/ActionStatus" }, { type: "null" }] }
            degraded: { type: boolean }
            approvalId: { type: [string, "null"] }
            approvalStatus: { oneOf: [{ $ref: "#/components/schemas/ApprovalStatus" }, { type: "null" }] }
            feedback: { type: [string, "null"] }
            resolvedBy: { type: [string, "null"] }
    SessionDetail:
      allOf:
        - $ref: "#/components/schemas/Session"
        - type: object
          required: [state, timeline]
          properties:
            state:
              type: object
              additionalProperties: true
              description: Stan sesji (capture, `signals`, `llm_tool_calls`).
            timeline: { type: array, items: { $ref: "#/components/schemas/TimelineEntry" } }

    # ------------------------------------------------------------ roles
    RoleGrant:
      type: object
      required: [serverId, serverName, serverWide, tools]
      properties:
        serverId: { type: string }
        serverName: { type: string }
        serverWide: { type: boolean }
        tools:
          type: object
          additionalProperties: { type: boolean }
          example: { warehouse.low_stock: true, warehouse.adjust_stock: false }
    GrantInput:
      type: object
      required: [serverId]
      properties:
        serverId: { type: string }
        serverWide: { type: boolean, default: false }
        tools:
          type: object
          additionalProperties: { type: boolean }
          default: {}
          description: Nazwy toola z prefiksem aplikacji lub bez. Zaznaczenie wszystkich = grant na całą aplikację.
    AgentRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/AgentStatus" }
    Role:
      type: object
      required: [id, name, description, status, grants, createdAt, updatedAt, assignedAgents, effectiveTools]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/RoleStatus" }
        grants: { type: array, items: { $ref: "#/components/schemas/RoleGrant" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        assignedAgents: { type: array, items: { $ref: "#/components/schemas/AgentRef" } }
        effectiveTools: { type: array, items: { $ref: "#/components/schemas/EffectiveTool" } }
    RoleSummary:
      type: object
      required: [id, name, description, status, grantedToolCount, assignedAgentIds, assignedAgents, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/RoleStatus" }
        grantedToolCount: { type: integer }
        assignedAgentIds: { type: array, items: { type: string } }
        assignedAgents: { type: array, items: { $ref: "#/components/schemas/AgentRef" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RoleCreate:
      type: object
      required: [name]
      properties:
        id: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9_-]{1,62}$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, default: "" }
        grants: { type: array, items: { $ref: "#/components/schemas/GrantInput" }, default: [] }
    RolePatch:
      type: object
      properties:
        name: { type: [string, "null"], minLength: 1, maxLength: 120 }
        description: { type: [string, "null"] }
        grants: { type: [array, "null"], items: { $ref: "#/components/schemas/GrantInput" } }

    # ------------------------------------------------------------ MCP registry
    Server:
      type: object
      required: [id, name, kind, protocol, url, health, toolCount, tools, toolDetails, lastSyncAt, requiresAuth, description, enabled, hasPolicyPack]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, const: remote }
        protocol: { type: string, enum: [rest, mcp] }
        url: { type: string }
        health: { $ref: "#/components/schemas/ServerHealth" }
        toolCount: { type: integer, description: Liczba włączonych tooli. }
        tools: { type: array, items: { type: string }, description: Włączone toole. }
        toolDetails:
          type: array
          items:
            type: object
            required: [name, kind, method, path, description, enabled]
            properties:
              name: { type: string }
              kind: { $ref: "#/components/schemas/ToolKind" }
              method: { type: [string, "null"] }
              path: { type: [string, "null"], description: Ścieżka HTTP albo nazwa toola MCP. }
              description: { type: [string, "null"] }
              enabled: { type: boolean }
        lastSyncAt: { type: string, format: date-time }
        requiresAuth: { type: boolean }
        description: { type: string }
        enabled: { type: boolean }
        hasPolicyPack: { type: boolean }

    # ------------------------------------------------------------ policies
    PolicyPack:
      type: object
      required: [appId, cedarPolicies, cedarSchema, params, paramsSchema, overrides, rules, effectiveParams, updatedAt]
      properties:
        appId: { type: string }
        cedarPolicies: { type: string }
        cedarSchema: { type: string }
        params: { type: object, additionalProperties: true }
        paramsSchema: { type: object, additionalProperties: true }
        overrides:
          type: object
          description: agent_id → parametry override.
          additionalProperties: { type: object, additionalProperties: true }
        rules:
          type: array
          description: Adnotacje reguł `forbid` z pakietu.
          items:
            type: object
            additionalProperties: true
            properties:
              id: { type: string }
              severity: { type: string, enum: [deny, escalate] }
              message: { type: [string, "null"] }
        effectiveParams:
          type: object
          description: agent_id → parametry po złożeniu z override.
          additionalProperties: { type: object, additionalProperties: true }
        updatedAt: { type: string, format: date-time }

    # ------------------------------------------------------------ settings / profile
    Workspace:
      type: object
      required: [orgName, defaultApprovalTtlSeconds, specialistFailClosed, auditRetentionDays, authMode]
      properties:
        orgName: { type: string }
        defaultApprovalTtlSeconds: { type: integer, enum: [300, 900, 1800, 3600] }
        specialistFailClosed: { type: boolean }
        auditRetentionDays: { type: integer, enum: [30, 90, 180, 365] }
        authMode: { type: string, const: invite_only }
    Operator:
      type: object
      required: [id, email, name, role, status, invitedAt, lastActiveAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [owner, admin, operator, viewer] }
        status: { type: string, enum: [active, invited, disabled] }
        invitedAt: { type: [string, "null"], format: date-time }
        lastActiveAt: { type: [string, "null"], format: date-time }
    Profile:
      type: object
      required: [userId, email, name, avatarUrl, authProvider, lastSignInAt, sessionExpiresAt, operator, workspace]
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: string }
        avatarUrl: { type: [string, "null"] }
        authProvider: { type: string, example: email }
        lastSignInAt: { type: "null" }
        sessionExpiresAt: { type: [string, "null"], format: date-time }
        operator:
          oneOf:
            - $ref: "#/components/schemas/Operator"
            - type: "null"
          description: Wpis z rostera; `null`, gdy użytkownika nie ma na liście operatorów.
        workspace:
          type: object
          required: [orgName, authMode]
          properties:
            orgName: { type: string }
            authMode: { type: string, const: invite_only }
    Specialist:
      type: object
      additionalProperties: true
      required: [id]
      properties:
        id: { type: string }
