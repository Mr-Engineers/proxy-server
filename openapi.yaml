      operationId: getPolicyPack
      responses:
        "200": { $ref: "#/components/responses/PolicyPack" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Policies]
      summary: Zapisz pakiet (z walidacją)
      description: Pominięte pola zostają bez zmian. Pakiet jest kompilowany przed zapisem — błąd → `400`, nic nie trafia do bazy.
      operationId: putPolicyPack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
